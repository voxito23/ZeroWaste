<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>ZeroWaste API Docs - ReDoc Backend</title>
    <link rel="icon" type="image/svg+xml" href="/api/favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color, #0d1117);
            color: var(--text-color, #c9d1d9);
            transition: all 0.3s;
        }
        
        .loading-container {
            display: flex; justify-content: center; align-items: center; min-height: 100vh;
            background-color: var(--bg-color, #0d1117); color: #10b981; font-family: 'Inter', sans-serif; font-size: 24px; font-weight: 700;
        }

        .theme-toggle-btn {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: #10b981;
            border: none;
            color: #fff;
            cursor: pointer;
            border-radius: 50%;
            width: 55px;
            height: 55px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 15px rgba(16,185,129,0.4);
            transition: all 0.3s;
            z-index: 9999;
        }
        .theme-toggle-btn:hover {
            transform: scale(1.1);
            background: #059669;
        }

        .nav-toggle-btn {
            position: fixed;
            bottom: 95px;
            right: 30px;
            background: #3b82f6;
            border: none;
            color: #fff;
            cursor: pointer;
            border-radius: 50%;
            width: 55px;
            height: 55px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 15px rgba(59,130,246,0.4);
            transition: all 0.3s;
            z-index: 9999;
        }
        .nav-toggle-btn:hover {
            transform: scale(1.1);
            background: #2563eb;
        }

        .logout-btn {
            position: fixed;
            bottom: 160px;
            right: 30px;
            background: #ef4444;
            border: none;
            color: #fff;
            cursor: pointer;
            border-radius: 50%;
            width: 55px;
            height: 55px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 15px rgba(239,68,68,0.4);
            transition: all 0.3s;
            z-index: 9999;
        }
        .logout-btn:hover {
            transform: scale(1.1);
            background: #dc2626;
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
</head>
<body>
    <button class="theme-toggle-btn" onclick="toggleTheme()" id="themeBtn" aria-label="Toggle Theme">
        <span class="material-symbols-outlined" id="themeIcon">light_mode</span>
    </button>
    <button class="nav-toggle-btn" onclick="window.location.href='/zw-docs'" title="Ir a Swagger UI (Documentación interactiva)">
        <span class="material-symbols-outlined">api</span>
    </button>
    <button class="logout-btn" onclick="window.location.href='/zw-interno/dashboard'" title="Volver al Panel Admin de Laravel">
        <span class="material-symbols-outlined">exit_to_app</span>
    </button>
    
    <div id="redoc-container">
        <div class="loading-container">Cargando Documentación ZeroWaste...</div>
    </div>
    
    <script src="https://cdn.redoc.ly/redoc/latest/bundles/redoc.standalone.js"></script>
    <script>
        const isDark = localStorage.getItem('redoc-theme-dark') !== 'false';
        
        if (isDark) {
            document.documentElement.style.setProperty('--bg-color', '#0d1117');
            document.documentElement.style.setProperty('--text-color', '#c9d1d9');
            document.getElementById('themeIcon').innerText = 'light_mode';
        } else {
            document.documentElement.style.setProperty('--bg-color', '#ffffff');
            document.documentElement.style.setProperty('--text-color', '#1e293b');
            document.getElementById('themeIcon').innerText = 'dark_mode';
        }

        function toggleTheme() {
            const currentDark = localStorage.getItem('redoc-theme-dark') !== 'false';
            localStorage.setItem('redoc-theme-dark', !currentDark);
            window.location.reload(); 
        }

        const themeConfig = isDark ? {
            colors: {
                primary: { main: '#10b981' },
                text: { primary: '#c9d1d9', secondary: '#8b949e' },
                responses: {
                    success: { color: '#34d399', backgroundColor: 'rgba(52, 211, 153, 0.1)' },
                    error: { color: '#ef4444', backgroundColor: 'rgba(239, 68, 68, 0.1)' }
                },
                http: { get: '#3b82f6', post: '#10b981', put: '#f59e0b', delete: '#ef4444' }
            },
            typography: {
                fontFamily: '"Inter", sans-serif',
                headings: { fontFamily: '"Inter", sans-serif', fontWeight: '800' },
                code: { backgroundColor: '#161b22', color: '#e5e7eb' }
            },
            sidebar: { backgroundColor: '#161b22', textColor: '#c9d1d9', activeTextColor: '#10b981' },
            rightPanel: { backgroundColor: '#0d1117' }
        } : {
            colors: {
                primary: { main: '#10b981' },
                text: { primary: '#1e293b', secondary: '#475569' },
                responses: {
                    success: { color: '#059669', backgroundColor: 'rgba(52, 211, 153, 0.1)' },
                    error: { color: '#dc2626', backgroundColor: 'rgba(239, 68, 68, 0.1)' }
                },
                http: { get: '#2563eb', post: '#059669', put: '#d97706', delete: '#dc2626' }
            },
            typography: {
                fontFamily: '"Inter", sans-serif',
                headings: { fontFamily: '"Inter", sans-serif', fontWeight: '800' },
                code: { backgroundColor: '#f1f5f9', color: '#334155' }
            },
            sidebar: { backgroundColor: '#f8fafc', textColor: '#1e293b', activeTextColor: '#10b981' },
            rightPanel: { backgroundColor: '#1e293b' }
        };

        Redoc.init('/zw-openapi.json', {
            theme: themeConfig,
            scrollYOffset: 50,
            hideDownloadButton: false,
            expandResponses: '200,201',
            nativeScrollbars: true
        }, document.getElementById('redoc-container'));
    </script>
</body>
</html>
