<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>{% block title %}Zero Waste{% endblock %}</title>
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='faviconZeroWaste.svg') }}">

    <!-- Script de Persistencia de Tema (Modo Claro por Defecto) -->
    <script>
        if (localStorage.getItem('theme') === 'dark') {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
            localStorage.setItem('theme', 'light');
        }

        function toggleTheme() {
            const isDark = document.documentElement.classList.toggle('dark');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            window.dispatchEvent(new Event('themeChanged'));
        }
    </script>

    <script src="https://cdn.tailwindcss.com?plugins=forms,typography,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        primary: "#00E096",
                        "primary-hover": "#00C281",
                        secondary: "#064E3B",
                        "forest-dark": "#022C22",
                        "surface-light": "#ECFDF5",
                        "surface-dark": "#062C25",
                        "text-light": "#064E3B",
                        "text-dark": "#D1FAE5",
                        accent: "#34D399",
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        display: ['Montserrat', 'sans-serif'],
                    },
                    maxWidth: { 'desktop': '1440px' }
                },
            },
        };
    </script>
    <style>
        .glass-panel { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .no-hyphens { hyphens: none !important; word-break: keep-all !important; overflow-wrap: normal !important; }

        /* BOTÓN TEMA */
        .theme-toggle-btn { background: transparent; border: none; box-shadow: none; }
        .theme-toggle-btn:hover { background: rgba(6, 78, 59, 0.08); transform: translateY(-1px) scale(1.04); }
        .dark .theme-toggle-btn { background: transparent; border: none; box-shadow: none; }
        .dark .theme-toggle-btn:hover { background: rgba(209, 250, 229, 0.10); }
        .theme-toggle-icon-light { color: #0f766e; font-variation-settings: 'FILL' 1, 'wght' 500, 'GRAD' 0, 'opsz' 24; text-shadow: 0 0 10px rgba(15, 118, 110, 0.10); }
        .theme-toggle-icon-dark { color: #d1fae5; font-variation-settings: 'FILL' 1, 'wght' 500, 'GRAD' 0, 'opsz' 24; text-shadow: 0 0 12px rgba(209, 250, 229, 0.18); }

        /* BOTÓN MAPA */
        .map-btn-custom { background: #064E3B; color: white; box-shadow: 0 10px 22px rgba(6, 78, 59, 0.20); }
        .map-btn-custom:hover { background: #022C22; box-shadow: 0 12px 28px rgba(2, 44, 34, 0.28); transform: translateY(-2px) scale(1.02); }
        .dark .map-btn-custom { background: #065f46; color: #ecfdf5; box-shadow: 0 10px 22px rgba(0, 0, 0, 0.25); }
        .dark .map-btn-custom:hover { background: #10b981; color: #022C22; box-shadow: 0 12px 28px rgba(16, 185, 129, 0.34); transform: translateY(-2px) scale(1.02); }

        /* BOTÓN CONTACTO */
        .contact-btn-custom { background: linear-gradient(to right, #00E096, #34D399); color: white; box-shadow: 0 10px 22px rgba(0, 224, 150, 0.22); }
        .contact-btn-custom:hover { background: linear-gradient(to right, #059669, #10b981); box-shadow: 0 12px 28px rgba(5, 150, 105, 0.26); transform: translateY(-2px) scale(1.02); }
        .dark .contact-btn-custom { background: linear-gradient(to right, #00C281, #10b981); color: white; }
        .dark .contact-btn-custom:hover { background: linear-gradient(to right, #34D399, #6ee7b7); color: #022C22; box-shadow: 0 12px 28px rgba(52, 211, 153, 0.35); transform: translateY(-2px) scale(1.02); }
        
        /* GLOBAL BADGE ANIMATIONS */
        @keyframes float-wave { 0%, 100% { transform: translateY(0px) rotate(0deg); } 50% { transform: translateY(-4px) rotate(1.5deg); } }
        .animate-float-wave { animation: float-wave 3.5s ease-in-out infinite; }
        @keyframes gradient-wave { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
        .bg-wave-gradient { background: linear-gradient(90deg, rgba(0,224,150,0.1), rgba(255,255,255,0.4), rgba(0,224,150,0.1)); background-size: 200% 200%; animation: gradient-wave 3s ease-in-out infinite; }
        .anim-fade { transition: opacity 0.6s ease-in-out, transform 0.6s ease-in-out; }
    </style>
    
    {% block styles %}{% endblock %}
</head>

<body class="bg-surface-light dark:bg-surface-dark text-text-light dark:text-text-dark font-sans transition-colors duration-300 flex flex-col min-h-screen">
    
    {% include 'includes/header.html' %}
    
    <main class="flex-grow">
        {% block content %}{% endblock %}
    </main>
    
    {% include 'includes/footer.html' %}
    
    {% block scripts %}{% endblock %}
</body>
</html>
