modules:
  http_2xx:
    prober: http
    timeout: 10s
    http:
      method: GET
      preferred_ip_protocol: ip4
      follow_redirects: true
      fail_if_ssl: false
      fail_if_not_ssl: true
      valid_http_versions: [HTTP/1.1, HTTP/2.0]
      tls_config:
        insecure_skip_verify: false

  http_2xx_internal:
    prober: http
    timeout: 5s
    http:
      method: GET
      preferred_ip_protocol: ip4
      follow_redirects: false
      fail_if_ssl: true
      fail_if_not_ssl: false
      valid_http_versions: [HTTP/1.1, HTTP/2.0]

  https_expected_404:
    prober: http
    timeout: 10s
    http:
      method: GET
      preferred_ip_protocol: ip4
      follow_redirects: true
      valid_status_codes: [404]
      fail_if_ssl: false
      fail_if_not_ssl: true
      valid_http_versions: [HTTP/1.1, HTTP/2.0]
      tls_config:
        insecure_skip_verify: false
