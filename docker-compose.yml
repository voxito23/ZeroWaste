version: '3.8'

services:
  # ===========================
  # Caddy — Proxy HTTPS Automático + Balanceador de Carga
  # ===========================
  caddy:
    image: caddy:2-alpine
    container_name: caddy_proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - cliente
      - admin
      - fast_api

  # ===========================
  # Flask — Sitio Principal (Servidor Público)
  # ===========================
  cliente:
    build: ./flask_zerowaste
    container_name: flask_app
    restart: always
    expose:
      - "5000"
    volumes:
      - ./flask_zerowaste:/app
      - perfiles_compartidos:/app/static/img/perfiles
    env_file:
      - ./flask_zerowaste/.env
    environment:
      - FLASK_DEBUG=false
      - HTTPS_ENABLED=false

  # ===========================
  # Laravel — Panel Admin (Servidor Privado)
  # ===========================
  admin:
    build: ./laravel_zerowaste
    container_name: laravel_admin
    restart: always
    expose:
      - "80"
    volumes:
      - ./laravel_zerowaste:/var/www/html
      - /var/www/html/vendor
      - perfiles_compartidos:/var/www/html/public/img/perfiles
      - ./flask_zerowaste/static/img:/var/www/flask_zerowaste/static/img
    env_file:
      - ./laravel_zerowaste/.env
    environment:
      - APP_ENV=production
      - APP_DEBUG=true
      # El APP_KEY ahora se carga desde ./laravel_zerowaste/.env

  # ===========================
  # FastAPI — API Backend (Servidor Privado)
  # ===========================
  fast_api:
    build: ./fast_api
    container_name: fastapi_app
    restart: always
    expose:
      - "6000"
    volumes:
      - ./fast_api:/app
      - perfiles_compartidos:/app/static/img/perfiles
    env_file:
      - ./fast_api/.env
    environment:
      - APP_ENV=production

  # ===========================
  # Prometheus — Monitoreo del Sistema
  # ===========================
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: prometheus_monitor
    restart: always
    ports:
      - "127.0.0.1:9090:9090"
    expose:
      - "9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'
      - '--web.external-url=https://zerowaste-qro.com/prometheus/'
      - '--web.route-prefix=/prometheus/'
    depends_on:
      - fast_api

  # ===========================
  # Grafana — Dashboard de Monitoreo
  # ===========================
  grafana:
    image: grafana/grafana:11.1.0
    container_name: grafana_dashboard
    restart: always
    ports:
      - "127.0.0.1:3000:3000"
    expose:
      - "3000"
    volumes:
      - grafana_data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=ZeroWaste2026!
      - GF_SERVER_ROOT_URL=https://zerowaste-qro.com/grafana/
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=false
    depends_on:
      - prometheus

  # ===========================
  # Tailwind — CSS Builder
  # ===========================
  tailwind:
    image: node:20-alpine
    container_name: tailwind_builder
    tty: true
    stdin_open: true
    working_dir: /app/frontend_build
    volumes:
      - ./flask_zerowaste:/app
    command: sh -c "npm install && npm run dev:css"
    restart: always

volumes:
  perfiles_compartidos:
  caddy_data:
  caddy_config:
  prometheus_data:
  grafana_data:
