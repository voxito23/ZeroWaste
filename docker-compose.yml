version: '3.8'

services:
  # ===========================
  # Nginx — Proxy Inverso
  # ===========================
  nginx:
    image: nginx:alpine
    container_name: nginx_proxy
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - cliente
      - admin
      - fast_api

  # ===========================
  # Flask — Sitio Principal
  # ===========================
  cliente:
    build: ./flask_zerowaste
    container_name: flask_app
    restart: always
    expose:
      - "5000"
    volumes:
      - ./flask_zerowaste:/app
      - perfiles_compartidos:/app/static/img/perfiles
    env_file:
      - ./flask_zerowaste/.env
    environment:
      - FLASK_DEBUG=false
      - HTTPS_ENABLED=false
    depends_on:
      db:
        condition: service_healthy

  # ===========================
  # Laravel — Panel Admin
  # ===========================
  admin:
    build: ./laravel_zerowaste
    container_name: laravel_admin
    restart: always
    expose:
      - "80"
    volumes:
      - ./laravel_zerowaste:/var/www/html
      - /var/www/html/vendor
      - perfiles_compartidos:/var/www/html/public/img/perfiles
      - ./flask_zerowaste/static/img:/var/www/flask_zerowaste/static/img
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - DB_CONNECTION=pgsql
      - DB_HOST=db
      - DB_PORT=5432
      - DB_DATABASE=zerowaste_db
      - DB_USERNAME=postgres
      - DB_PASSWORD=postgrespassword
    depends_on:
      db:
        condition: service_healthy

  # ===========================
  # FastAPI — API Backend
  # ===========================
  fast_api:
    build: ./fast_api
    container_name: fastapi_app
    restart: always
    expose:
      - "6000"
    volumes:
      - ./fast_api:/app
      - perfiles_compartidos:/app/static/img/perfiles
    env_file:
      - ./fast_api/.env
    environment:
      - APP_ENV=production
    depends_on:
      db:
        condition: service_healthy

  # ===========================
  # PostgreSQL — Base de Datos
  # ===========================
  db:
    image: postgres:16-alpine
    container_name: postgres_db
    restart: always
    expose:
      - "5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: zerowaste_db
    volumes:
      - postgres_data_zerowaste:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d zerowaste_db" ]
      interval: 5s
      retries: 5
      timeout: 5s

  # ===========================
  # Tailwind — CSS Builder
  # ===========================
  tailwind:
    image: node:20-alpine
    container_name: tailwind_builder
    tty: true
    stdin_open: true
    working_dir: /app/frontend_build
    volumes:
      - ./flask_zerowaste:/app
    command: sh -c "npm install && npm run dev:css"
    restart: always

volumes:
  postgres_data_zerowaste:
  perfiles_compartidos:
