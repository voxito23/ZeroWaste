version: '3.8'

services:
  cliente:
    build: ./flask_zerowaste
    container_name: flask_app
    restart: always
    ports:
      - "5001:5000"
    volumes:
      - ./flask_zerowaste:/app
      - perfiles_compartidos:/app/static/img/perfiles
    environment:
      - DATABASE_URL=postgresql://postgres:postgrespassword@db:5432/zerowaste_db
    depends_on:
      db:
        condition: service_healthy

  admin:
    build: ./laravel_zerowaste
    container_name: laravel_admin
    restart: always
    ports:
      - "8001:80"
    volumes:
      - ./laravel_zerowaste:/var/www/html
      - /var/www/html/vendor
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - DB_CONNECTION=pgsql
      - DB_HOST=db
      - DB_PORT=5432
      - DB_DATABASE=zerowaste_db
      - DB_USERNAME=postgres
      - DB_PASSWORD=postgrespassword
    depends_on:
      db:
        condition: service_healthy

  fast_api:
    build: ./fast_api
    container_name: fastapi_app
    restart: always
    ports:
      - "6001:6000"
    volumes:
      - ./fast_api:/app
      - perfiles_compartidos:/app/static/img/perfiles
    environment:
      - DATABASE_URL=postgresql://postgres:postgrespassword@db:5432/zerowaste_db
      - JWT_SECRET_KEY=zerowaste_super_secret_jwt_2026
      - JWT_EXPIRE_MINUTES=60
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    container_name: postgres_db
    restart: always
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: zerowaste_db
    volumes:
      - postgres_data_zerowaste:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d zerowaste_db" ]
      interval: 5s
      retries: 5
      timeout: 5s

  tailwind:
    image: node:20-alpine
    container_name: tailwind_builder
    tty: true
    stdin_open: true
    working_dir: /app
    volumes:
      - ./flask_zerowaste:/app
    command: sh -c "npm install && npm run dev:css"
    restart: always

volumes:
  postgres_data_zerowaste:
  perfiles_compartidos:
