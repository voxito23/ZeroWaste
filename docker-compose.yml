version: '3.8'

services:
  # ===========================
  # Caddy — Proxy HTTPS Automático
  # ===========================
  caddy:
    image: caddy:2-alpine
    container_name: caddy_proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - cliente
      - admin
      - fast_api

  # ===========================
  # Flask — Sitio Principal
  # ===========================
  cliente:
    build: ./flask_zerowaste
    container_name: flask_app
    restart: always
    expose:
      - "5000"
    volumes:
      - ./flask_zerowaste:/app
      - perfiles_compartidos:/app/static/img/perfiles
    env_file:
      - ./flask_zerowaste/.env
    environment:
      - FLASK_DEBUG=false
      - HTTPS_ENABLED=false

  # ===========================
  # Laravel — Panel Admin
  # ===========================
  admin:
    build: ./laravel_zerowaste
    container_name: laravel_admin
    restart: always
    expose:
      - "80"
    volumes:
      - ./laravel_zerowaste:/var/www/html
      - /var/www/html/vendor
      - perfiles_compartidos:/var/www/html/public/img/perfiles
      - ./flask_zerowaste/static/img:/var/www/flask_zerowaste/static/img
    env_file:
      - ./laravel_zerowaste/.env
    environment:
      - APP_ENV=production
      - APP_DEBUG=true
      # El APP_KEY ahora se carga desde ./laravel_zerowaste/.env

  # ===========================
  # FastAPI — API Backend
  # ===========================
  fast_api:
    build: ./fast_api
    container_name: fastapi_app
    restart: always
    expose:
      - "6000"
    volumes:
      - ./fast_api:/app
      - perfiles_compartidos:/app/static/img/perfiles
    env_file:
      - ./fast_api/.env
    environment:
      - APP_ENV=production

  # ===========================
  # PostgreSQL — Eliminado (Migrado a Supabase)
  # ===========================

  # ===========================
  # Tailwind — CSS Builder
  # ===========================
  tailwind:
    image: node:20-alpine
    container_name: tailwind_builder
    tty: true
    stdin_open: true
    working_dir: /app/frontend_build
    volumes:
      - ./flask_zerowaste:/app
    command: sh -c "npm install && npm run dev:css"
    restart: always

volumes:
  perfiles_compartidos:
  caddy_data:
  caddy_config:
