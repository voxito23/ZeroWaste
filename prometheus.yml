# ===== Prometheus — Configuración de Scraping =====
# Recopila métricas de FastAPI cada 15 segundos.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'zerowaste-fastapi'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['fast_api:6000']
        labels:
          service: 'fastapi'
          environment: 'production'

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
