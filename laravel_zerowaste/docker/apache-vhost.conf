ServerTokens Prod
ServerSignature Off
TraceEnable Off

Listen 80

<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    LogFormat "request_id=%{X-Request-ID}i remote=%a method=%m path=%U status=%>s bytes=%B duration_us=%D" zerowaste
    CustomLog /proc/self/fd/1 zerowaste
    ErrorLog /proc/self/fd/2
</VirtualHost>
