server {
    listen 80;
    server_name zerowaste-qro.com www.zerowaste-qro.com;

    client_max_body_size 256M;

    # =========================
    # Flask (sitio principal)
    # =========================
    # Todo el tráfico principal va a Flask
    location / {
        proxy_pass http://cliente:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # =========================
    # Laravel (panel admin)
    # =========================
    # Accede con: zerowaste-qro.com/admin/
    location /admin/ {
        proxy_pass http://admin:80/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # =========================
    # FastAPI (API)
    # =========================
    # Accede con: zerowaste-qro.com/api/
    location /api/ {
        proxy_pass http://fast_api:6000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
