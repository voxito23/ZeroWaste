server_tokens off;

log_format media_structured escape=json '{"time":"$time_iso8601","remote":"$remote_addr",'
    '"method":"$request_method","uri":"$uri","status":$status,'
    '"bytes":$body_bytes_sent,"duration":$request_time}';

server {
    listen 8080;
    root /data;
    access_log /var/log/nginx/access.log media_structured;
    error_log /var/log/nginx/error.log warn;
    client_max_body_size 1m;
    autoindex off;
    etag on;
    disable_symlinks on;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 'ok';
    }

    # Only canonical, single-file media paths are served. The explicit
    # category allow-list prevents the mount root and incidental files from
    # becoming publicly browsable.
    location ~ ^/media/(foro|perfiles|recompensas|campanas|eventos|puntos)/[A-Za-z0-9][A-Za-z0-9._-]*$ {
        limit_except GET HEAD { deny all; }
        try_files $uri =404;
        # Do not make temporary 404 responses sticky in browsers while legacy
        # files are being migrated into the shared volume.
        add_header Cache-Control "public, max-age=604800, stale-while-revalidate=86400";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'none'; sandbox" always;
    }

    location / { return 404; }
}
