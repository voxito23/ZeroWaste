server_tokens off;

# Docker's embedded DNS plus runtime upstream resolution avoids stale backend
# addresses after an individual Compose service is recreated.
resolver 127.0.0.11 valid=10s ipv6=off;
resolver_timeout 5s;

# Caddy overwrites X-Real-IP with its direct TCP peer. Nginx is not published
# and therefore accepts this header only from private Docker peers.
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Real-IP;
real_ip_recursive off;

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

map $http_x_forwarded_proto $forwarded_proto {
    ~*^https$ https;
    ~*^http$ http;
    default $scheme;
}

map $http_x_request_id $correlation_id {
    "~^[A-Za-z0-9._-]{1,128}$" $http_x_request_id;
    default $request_id;
}

map $http_x_forwarded_for $forwarded_for_chain {
    '' $remote_addr;
    default $http_x_forwarded_for;
}

log_format structured escape=json '{"time":"$time_iso8601","request_id":"$correlation_id",'
    '"remote":"$remote_addr","method":"$request_method","uri":"$uri",'
    '"status":$status,"duration":$request_time,"upstream":"$upstream_addr",'
    '"upstream_status":"$upstream_status","upstream_time":"$upstream_response_time"}';

upstream fastapi_backend {
    zone fastapi_backend 64k;
    server fast_api:6000 resolve max_fails=2 fail_timeout=10s;
    keepalive 16;
}

upstream laravel_backend {
    zone laravel_backend 64k;
    server laravel:80 resolve max_fails=2 fail_timeout=10s;
    keepalive 16;
}

# Normal internal HTTP traffic. Only Caddy connects from the public edge.
server {
    listen 8080;
    access_log /var/log/nginx/access.log structured;
    error_log /var/log/nginx/error.log warn;
    # Backend validators accept files up to 5 MiB; 8 MiB leaves room for
    # multipart form overhead without accepting unbounded request bodies.
    client_max_body_size 8m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Request-ID $correlation_id always;

    location = /metrics { return 404; }
    location = /api/metrics { return 404; }
    location = /stub_status { return 404; }
    location = /nginx-health { return 404; }

    location = /load-balancer-health {
        proxy_pass http://fastapi_backend/load-balancer-health;
        include /etc/nginx/proxy_params;
    }

    location = /load-balancer-ready {
        proxy_pass http://fastapi_backend/load-balancer-ready;
        include /etc/nginx/proxy_params;
    }

    location = /api {
        proxy_pass http://fastapi_backend/;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Forwarded-Prefix /api;
    }

    location /api/ {
        proxy_pass http://fastapi_backend/;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Forwarded-Prefix /api;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    location ~ ^/(zw-docs|zw-openapi\.json|zw-redoc) {
        proxy_pass http://fastapi_backend;
        include /etc/nginx/proxy_params;
    }

    location /zw-interno {
        proxy_pass http://laravel_backend;
        include /etc/nginx/proxy_params;
    }

    # Flask is routed directly by Caddy; Nginx is deliberately limited to API
    # and administrative traffic.
    location / { return 404; }
}

# Process health and Nginx stub_status are isolated from the public handler.
server {
    listen 8081;
    access_log off;
    error_log /var/log/nginx/error.log warn;

    location = /nginx-health {
        default_type text/plain;
        return 200 'ok';
    }

    location = /stub_status {
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
        stub_status;
    }

    location / { return 404; }
}
