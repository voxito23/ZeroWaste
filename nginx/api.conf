server_tokens off;

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    '' $scheme;
}

log_format structured escape=json '{"time":"$time_iso8601","remote":"$remote_addr",'
    '"method":"$request_method","uri":"$uri","status":$status,'
    '"duration":$request_time,"upstream":"$upstream_addr"}';

upstream fastapi_backend { server fast_api:6000; keepalive 16; }
upstream flask_backend { server cliente:5000; keepalive 8; }
upstream laravel_backend {
    # Active/passive: admin serves normally and admin2 takes over when the
    # primary cannot accept a connection or returns a gateway-level failure.
    server admin:80 max_fails=2 fail_timeout=10s;
    server admin2:80 max_fails=2 fail_timeout=10s backup;
    keepalive 8;
}
upstream laravel_secondary {
    server admin2:80 max_fails=2 fail_timeout=10s;
    keepalive 4;
}

server {
    listen 8081;
    access_log /var/log/nginx/access.log structured;
    error_log /var/log/nginx/error.log warn;
    # Preserve the existing 250 MB profile upload contract. A future API
    # change should lower this limit together with the FastAPI validator.
    client_max_body_size 256m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location = /nginx-health { access_log off; return 200 'ok'; }
    location = /metrics { return 404; }
    location = /api/metrics { return 404; }
    location = /stub_status { return 404; }

    location = /api {
        proxy_pass http://fastapi_backend/;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Forwarded-Prefix /api;
    }
    location /api/ {
        proxy_pass http://fastapi_backend/;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Forwarded-Prefix /api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
    location ~ ^/(zw-docs|zw-openapi\.json|zw-redoc) {
        proxy_pass http://fastapi_backend;
        include /etc/nginx/proxy_params;
    }
    # Explicit secondary URL for health checks and manual validation. It uses
    # the same authentication and admin middleware as the primary instance.
    location = /zw-interno/2 {
        return 308 https://$host/zw-interno/2/login;
    }
    location = /zw-interno/2/ {
        return 308 https://$host/zw-interno/2/login;
    }
    location ^~ /zw-interno/2 {
        rewrite ^/zw-interno/2(?:/(.*))?$ /zw-interno/$1 break;
        proxy_pass http://laravel_secondary;
        include /etc/nginx/proxy_params;
        # Keep the explicit /2 alias visible in redirects, links and forms
        # while admin2 internally serves the failover-compatible URI.
        proxy_set_header Accept-Encoding "";
        proxy_redirect /zw-interno/ /zw-interno/2/;
        proxy_redirect https://www.zerowaste-qro.com/zw-interno/ https://www.zerowaste-qro.com/zw-interno/2/;
        sub_filter_once off;
        sub_filter 'https://www.zerowaste-qro.com/zw-interno' 'https://www.zerowaste-qro.com/zw-interno/2';
        sub_filter '"/zw-interno/' '"/zw-interno/2/';
        sub_filter "'/zw-interno/" "'/zw-interno/2/";
        proxy_connect_timeout 3s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
    location /zw-interno {
        proxy_pass http://laravel_backend;
        include /etc/nginx/proxy_params;
        proxy_connect_timeout 3s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_next_upstream error timeout invalid_header http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
        proxy_next_upstream_timeout 10s;
    }
    location / {
        proxy_pass http://flask_backend;
        include /etc/nginx/proxy_params;
        proxy_read_timeout 60s;
    }
}

server {
    listen 8080;
    access_log off;
    location = /stub_status { stub_status; }
    location / { return 404; }
}
