groups:
  - name: zerowaste-two-droplets
    rules:
      - alert: ZeroWastePrimaryDown
        expr: probe_success{job="blackbox-origins",node_role="primary",probe="health"} == 0 and probe_success{job="blackbox-origins",node_role="secondary",probe="health"} == 1
        for: 2m
        labels: {severity: warning}
        annotations: {summary: "Primary unavailable; secondary is ready"}
      - alert: ZeroWasteSecondaryDown
        expr: probe_success{job="blackbox-origins",node_role="secondary",probe="health"} == 0
        for: 2m
        labels: {severity: warning}
        annotations: {summary: "Secondary unavailable"}
      - alert: ZeroWasteBothNodesDown
        expr: sum(probe_success{job="blackbox-origins",probe="health"}) == 0
        for: 2m
        labels: {severity: critical}
        annotations: {summary: "Both ZeroWaste nodes are unavailable"}
      - alert: ZeroWasteFailoverActive
        expr: probe_success{job="blackbox-origins",node_role="primary",probe="health"} == 0 and probe_success{job="blackbox-public",instance=~".*/load-balancer-health"} == 1 and probe_success{job="blackbox-origins",node_role="secondary",probe="health"} == 1
        for: 2m
        labels: {severity: warning}
        annotations: {summary: "An authorized external failover is probably active"}
      - alert: ZeroWastePublicEndpointDown
        expr: probe_success{job="blackbox-public"} == 0
        for: 2m
        labels: {severity: critical}
        annotations: {summary: "Public endpoint is unavailable"}
      - alert: ZeroWasteNodeHighMemory
        expr: 100 * (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) > 90
        for: 5m
        labels: {severity: warning}
        annotations: {summary: "Node memory usage exceeds 90%"}
      - alert: ZeroWasteNodeLowDisk
        expr: 100 * node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay"} < 15
        for: 5m
        labels: {severity: warning}
        annotations: {summary: "Node disk availability is below 15%"}
      - alert: ZeroWasteExporterTunnelDown
        expr: up{job="cross-account-exporters",node_role="secondary"} == 0
        for: 2m
        labels: {severity: warning}
        annotations: {summary: "Secondary WireGuard exporter path is unavailable"}
      - alert: ZeroWasteSharedRedisDown
        expr: redis_up{job="redis-external"} == 0
        for: 2m
        labels: {severity: critical}
        annotations: {summary: "Shared Redis is unavailable"}
      - alert: ZeroWasteSupabaseNotReady
        expr: probe_success{job="blackbox-origins",probe="ready"} == 0
        for: 2m
        labels: {severity: critical}
        annotations: {summary: "A node cannot reach shared dependencies"}
      - alert: ZeroWasteMediaStorageDown
        expr: zerowaste_media_storage_ready == 0
        for: 2m
        labels: {severity: critical}
        annotations: {summary: "Shared media storage is unavailable"}
      - alert: ZeroWasteHighErrorRate
        expr: sum(rate(http_requests_total{status=~"5.."}[5m])) / clamp_min(sum(rate(http_requests_total[5m])), 1) > 0.05
        for: 5m
        labels: {severity: warning}
        annotations: {summary: "HTTP 5xx rate exceeds 5%"}
      - alert: ZeroWasteHighLatency
        expr: histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket[5m]))) > 2
        for: 5m
        labels: {severity: warning}
        annotations: {summary: "La latencia HTTP p95 supera dos segundos"}
      - alert: ZeroWasteRateLimitSpike
        expr: sum(increase(zerowaste_rate_limits_total[5m])) > 30
        for: 2m
        labels: {severity: warning}
        annotations: {summary: "Aumento sostenido de solicitudes limitadas por FastAPI"}
      - alert: ZeroWasteFirewallBlockSpike
        expr: sum(increase(zerowaste_firewall_blocks_total[5m])) > 20
        for: 2m
        labels: {severity: warning}
        annotations: {summary: "El WAF está bloqueando un volumen inusual de solicitudes"}
