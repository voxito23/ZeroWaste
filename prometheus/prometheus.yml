global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: production
    project: zerowaste

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [prometheus:9090]
        labels: {service: prometheus}

  - job_name: caddy
    metrics_path: /metrics
    static_configs:
      - targets: [caddy:2019]
        labels: {service: caddy}

  - job_name: zerowaste-fastapi
    metrics_path: /metrics
    static_configs:
      - targets: [fast_api:6000]
        labels: {service: fastapi}

  - job_name: grafana
    metrics_path: /grafana/metrics
    static_configs:
      - targets: [grafana:3000]
        labels: {service: grafana}

  - job_name: nginx-api
    static_configs:
      - targets: [nginx_exporter:9113]
        labels: {service: nginx}

  - job_name: redis
    static_configs:
      - targets: [redis_exporter:9121]
        labels: {service: redis}

  - job_name: node
    static_configs:
      - targets: [node_exporter:9100]
        labels: {service: host}

  - job_name: cadvisor
    static_configs:
      - targets: [cadvisor:8080]
        labels: {service: containers}

  - job_name: blackbox-https
    metrics_path: /probe
    params: {module: [http_2xx]}
    static_configs:
      - targets:
          - https://www.zerowaste-qro.com/
          - https://www.zerowaste-qro.com/api/health
          - https://www.zerowaste-qro.com/api/ready
          - https://www.zerowaste-qro.com/api/mapa/puntos
          - https://www.zerowaste-qro.com/api/foro/posts
          - https://www.zerowaste-qro.com/zw-interno/login
          - https://www.zerowaste-qro.com/zw-interno/2/login
          - https://www.zerowaste-qro.com/grafana/login
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115

  - job_name: blackbox-internal
    metrics_path: /probe
    params: {module: [http_2xx_internal]}
    static_configs:
      - targets:
          - http://caddy:2019/health
          - http://nginx_api:8081/nginx-health
          - http://fast_api:6000/health
          - http://cliente:5000/health
          - http://laravel1/up
          - http://laravel2/up
          - http://prometheus:9090/-/healthy
          - http://grafana:3000/grafana/api/health
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115

  - job_name: blackbox-readiness
    metrics_path: /probe
    params: {module: [http_2xx_internal]}
    static_configs:
      - targets:
          - http://fast_api:6000/ready
          - http://cliente:5000/ready
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115

  # A deliberate missing object must remain a clean HTTPS 404. This checks the
  # complete Caddy -> media_static path without requiring production media to
  # exist during first boot or exposing an internal health route publicly.
  - job_name: blackbox-media-route
    metrics_path: /probe
    params: {module: [https_expected_404]}
    static_configs:
      - targets:
          - https://www.zerowaste-qro.com/media/foro/__blackbox_missing__.png
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115

  - job_name: blackbox
    static_configs:
      - targets: [blackbox:9115]
        labels: {service: blackbox}
