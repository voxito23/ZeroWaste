global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels: {cluster: zerowaste, environment: production}
rule_files: [/etc/prometheus/rules/*.yml]

scrape_configs:
  - job_name: prometheus
    static_configs: [{targets: [prometheus:9090], labels: {service: prometheus}}]
  - job_name: caddy-primary
    static_configs: [{targets: [caddy:2019], labels: {service: caddy, instance_name: zerowaste-app-01, node_role: primary}}]
  - job_name: fastapi-primary
    static_configs: [{targets: [fast_api:6000], labels: {service: fastapi, instance_name: zerowaste-app-01, node_role: primary}}]
  - job_name: nginx-primary
    static_configs: [{targets: [nginx_exporter:9113], labels: {service: nginx, instance_name: zerowaste-app-01, node_role: primary}}]
  - job_name: redis-external
    static_configs: [{targets: [redis_exporter:9121], labels: {service: redis}}]
  - job_name: node-primary
    static_configs: [{targets: [node_exporter:9100], labels: {service: node, instance_name: zerowaste-app-01, node_role: primary}}]
  - job_name: cadvisor-primary
    static_configs: [{targets: [cadvisor:8080], labels: {service: cadvisor, instance_name: zerowaste-app-01, node_role: primary}}]

  # The same external nodes.yml file is reused by these jobs. Labels select
  # only the relevant endpoint, keeping cross-account addresses in one place.
  - job_name: cross-account-exporters
    file_sd_configs: [{files: [/etc/prometheus/targets/nodes.yml], refresh_interval: 30s}]

  - job_name: blackbox-public
    metrics_path: /probe
    params: {module: [http_2xx]}
    static_configs:
      - targets:
          - https://www.zerowaste-qro.com/load-balancer-health
          - https://www.zerowaste-qro.com/api/health
          - https://www.zerowaste-qro.com/api/ready
          - https://www.zerowaste-qro.com/zw-interno
          - https://www.zerowaste-qro.com/
        labels: {service: public}
    relabel_configs:
      - {source_labels: [__address__], target_label: __param_target}
      - {source_labels: [__param_target], target_label: instance}
      - {target_label: __address__, replacement: blackbox:9115}

  - job_name: blackbox-origins
    metrics_path: /probe
    params: {module: [http_2xx_internal]}
    file_sd_configs: [{files: [/etc/prometheus/targets/origins.yml], refresh_interval: 30s}]
    relabel_configs:
      - {source_labels: [__address__], target_label: __param_target}
      - {source_labels: [__param_target], target_label: instance}
      - {target_label: __address__, replacement: blackbox:9115}

  - job_name: blackbox
    static_configs: [{targets: [blackbox:9115], labels: {service: blackbox}}]
