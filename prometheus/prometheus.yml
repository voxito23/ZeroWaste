global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [prometheus:9090]

  - job_name: zerowaste-fastapi
    metrics_path: /metrics
    static_configs:
      - targets: [fast_api:6000]
        labels: {service: fastapi, environment: production}

  - job_name: nginx-api
    static_configs:
      - targets: [nginx_exporter:9113]
        labels: {service: nginx}

  - job_name: redis
    static_configs:
      - targets: [redis_exporter:9121]
        labels: {service: redis}

  - job_name: node
    static_configs:
      - targets: [node_exporter:9100]

  - job_name: cadvisor
    static_configs:
      - targets: [cadvisor:8080]

  - job_name: blackbox-https
    metrics_path: /probe
    params: {module: [http_2xx]}
    static_configs:
      - targets:
          - https://www.zerowaste-qro.com/
          - https://www.zerowaste-qro.com/api/health
          - https://www.zerowaste-qro.com/api/ready
          - https://www.zerowaste-qro.com/api/mapa/puntos
          - https://www.zerowaste-qro.com/zw-interno/login
          - https://www.zerowaste-qro.com/zw-interno/2/login
          - https://www.zerowaste-qro.com/grafana/login
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115

  - job_name: blackbox-laravel-replicas
    metrics_path: /probe
    params: {module: [http_2xx]}
    static_configs:
      - targets:
          - http://admin/up
          - http://admin2/up
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115

  - job_name: blackbox
    static_configs:
      - targets: [blackbox:9115]
